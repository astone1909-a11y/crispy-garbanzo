<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>Macro Tracker</h1>
    <input type="date" id="date-picker">
  </header>

  <section class="targets-panel">
    <h2>Daily Targets</h2>
    <div class="targets-grid">
      <label>Calories <input type="number" id="target-cal" min="0" step="10"></label>
      <label>Protein (g) <input type="number" id="target-protein" min="0" step="1"></label>
      <label>Carbs (g) <input type="number" id="target-carbs" min="0" step="1"></label>
      <label>Fat (g) <input type="number" id="target-fat" min="0" step="1"></label>
    </div>
  </section>

  <section class="progress-panel" id="progress-panel">
    <!-- populated by app.js -->
  </section>

  <section class="add-food-panel">
    <h2>Log Food</h2>
    <form id="add-food-form">
      <div class="form-row">
        <label>Meal
          <select id="meal-select">
            <option>Breakfast</option>
            <option>Lunch</option>
            <option>Dinner</option>
            <option>Snack</option>
          </select>
        </label>
        <label>Quick add
          <select id="quick-add-select">
            <option value="">-- choose a food --</option>
          </select>
        </label>
        <label>Servings
          <input type="number" id="quick-add-qty" value="1" min="0.1" step="0.1">
        </label>
        <button type="button" id="quick-add-btn">Add</button>
      </div>

      <details>
        <summary>Or enter a custom food</summary>
        <div class="form-row">
          <label>Name <input type="text" id="custom-name" placeholder="e.g. Protein bar"></label>
          <label>Calories <input type="number" id="custom-cal" min="0" step="1"></label>
          <label>Protein (g) <input type="number" id="custom-protein" min="0" step="0.1"></label>
          <label>Carbs (g) <input type="number" id="custom-carbs" min="0" step="0.1"></label>
          <label>Fat (g) <input type="number" id="custom-fat" min="0" step="0.1"></label>
          <button type="submit">Add custom food</button>
        </div>
      </details>
    </form>
  </section>

  <section class="log-panel">
    <h2>Today's Log</h2>
    <div id="log-container"></div>
    <button id="clear-day-btn" class="danger">Clear Day</button>
  </section>
</div>

<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
